site_name: KaiDO , l'art d'apprendre avec l'IA
site_description: "Le compagnon écrit de la chaîne YouTube KaiDO : installer son agent IA, réviser un module de bachelor, et comprendre ce qui fait réellement apprendre."
site_url: https://alogean.github.io/kaido/
repo_url: https://github.com/alogean/kaido
repo_name: alogean/kaido

theme:
  name: material
  language: fr
  logo: assets/kaido-mark.svg
  favicon: assets/favicon.svg
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  features:
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Accueil: index.md
  - 1. Installation et outils:
      - outils/index.md
      - Les cinq vidéos: outils/parcours-video.md
      - Comprendre avant d'installer: outils/comprendre-avant-installer.md
      - Installer Claude Code et VS Code: outils/installer-claude-code.md
      - Ligne de commande et markdown: outils/ligne-de-commande-et-markdown.md
      - Créer son agent: outils/creer-son-agent.md
      - Le coût des abonnements: outils/abonnements.md
      - La skill KaiDO: outils/skill-kaido.md
  - 2. Bachelor en psychologie:
      - psycho/index.md
      - Méthode par module: psycho/methode-module.md
      - "Module M17, psychopathologie": psycho/m17.md
  - 3. Méthodologie d'apprentissage:
      - methode/index.md
      - Concepts: methode/concepts.md
      - Charge cognitive: methode/charge-cognitive.md
      - Apprentissage cognitif: methode/apprentissage-cognitif.md
      - Bibliographie notée: methode/bibliographie.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang: fr

extra_css:
  - stylesheets/extra.css
